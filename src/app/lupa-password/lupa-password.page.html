<ion-header>
  <ion-toolbar>
    <ion-title>Lupa Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="container">

    <h2>Lupa Password?</h2>

    <p class="keterangan">
      Silakan masukkan username dan password baru Anda.
    </p>

    <ion-item>
      <ion-label position="stacked">Username</ion-label>
      <ion-input
        type="text"
        [(ngModel)]="username"
        placeholder="Masukkan username">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Password Baru</ion-label>
      <ion-input
        type="password"
        [(ngModel)]="passwordBaru"
        placeholder="Masukkan password baru">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Konfirmasi Password Baru</ion-label>
      <ion-input
        type="password"
        [(ngModel)]="konfirmasiPassword"
        placeholder="Masukkan kembali password baru">
      </ion-input>
    </ion-item>

    <ion-button
      expand="block"
      class="tombol-simpan"
      (click)="ubahPassword()">
      Simpan Password Baru
    </ion-button>

    <ion-button
      expand="block"
      fill="clear"
      class="tombol-kembali"
      routerLink="/login">
      Kembali ke Login
    </ion-button>

  </div>

</ion-content>
